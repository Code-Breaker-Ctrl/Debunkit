version: "3.8"

services:
  web:
    build: .
    container_name: debunkit-web
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-debunkit-production-super-secret-key}
      - COHERE_API_KEY=${COHERE_API_KEY}
      - DATABASE_URL=postgresql://debunkit:debunkit_password@db:5432/debunkit
      - RATELIMIT_STORAGE_URI=redis://redis:6379/0
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: debunkit-db
    environment:
      POSTGRES_USER: debunkit
      POSTGRES_PASSWORD: debunkit_password
      POSTGRES_DB: debunkit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debunkit"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: debunkit-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
